services:
  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CMS_URL: https://cms.marleyportfolio.fr
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  strapi:
    build:
      context: ./cms
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./cms/.env
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    depends_on:
      - postgres

  # App de veille cyber (PWA). Utilise le Postgres ci-dessus, dans un schéma séparé « veille ».
  veille:
    build:
      context: ./veille
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      VEILLE_PASSWORD: ${VEILLE_PASSWORD:-}
      VEILLE_URL: https://veille.marleyportfolio.fr
      NVD_API_KEY: ${NVD_API_KEY:-}
    depends_on:
      - postgres

  caddy:
    image: caddy:2-alpine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - strapi
      - veille

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  strapi_uploads:
